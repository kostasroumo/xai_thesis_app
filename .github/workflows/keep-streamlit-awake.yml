name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit health endpoint
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$STREAMLIT_APP_URL" ]; then
            echo "Missing STREAMLIT_APP_URL repository secret."
            exit 1
          fi

          health_url="${STREAMLIT_APP_URL%/}/_stcore/health"
          echo "Pinging ${health_url}"
          curl --fail --location --max-time 60 --retry 3 --retry-delay 10 "$health_url"
